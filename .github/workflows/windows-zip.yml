name: Windows ZIP/EXE

on: [push]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Build
      shell: powershell
      run: .\package\make_windows_release.ps1

    - uses: actions/upload-artifact@v7
      with:
        name: simcoupe-zip
        path: SimCoupe-*-win_*.zip

    - uses: actions/upload-artifact@v7
      with:
        name: simcoupe-exe
        path: SimCoupe-*-win.exe
